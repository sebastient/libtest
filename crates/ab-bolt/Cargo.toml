# Standalone package (excluded from the root workspace, like the capi/py
# crates). One BoltFFI module ("ab") exporting BOTH A's and B's surfaces —
# BoltFFI supports multi-crate composition into a single module, but not two
# separately-packed modules sharing a type (per-crate IR, unprefixed
# boltffi_core runtime symbols), so the module boundary sits ABOVE our C ABI:
# the cross-library interface remains liba.so <-> libb.so underneath.
[workspace]

[package]
name = "ab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Sébastien Taylor <sebastien@au-zone.com>"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Path dep to the sibling fork checkout so the macros/runtime and the
# installed CLI are guaranteed to be the same commit (mobile-sdk pins the
# same fork by git rev instead).
boltffi = { path = "/Users/sebastien/Software/Mobile/boltffi/boltffi" }
a = { path = "../a", default-features = false }
b = { path = "../b", default-features = false }

[features]
# Per-platform backend selection:
#   static  — Apple: the implementation is compiled into the staticlib that
#             becomes the XCFramework (one copy of A via cargo, iOS packaging
#             is static anyway).
#   dynamic — Android/Linux: thin bolt .so linking liba.so/libb.so as real
#             DT_NEEDED deps; all three ship in jniLibs.
default = ["static"]
static = ["a/static", "b/static"]
dynamic = ["a/dynamic", "b/dynamic"]

# Excluded packages cannot use `lints.workspace = true` (that requires
# workspace membership), so the root's lint table is repeated here verbatim.
# Same tax as the repeated version/edition fields — see "Workspace
# mechanics" in ARCHITECTURE.md. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pub_underscore_fields = "allow"

# Standalone package (excluded from the root workspace, like the capi
# crates). Builds Python extension module `a`.
[workspace]

[package]
name = "a-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Sébastien Taylor <sebastien@au-zone.com>"]

[lib]
name = "a"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311 is the floor for THIS module specifically: the buffer-protocol
# type slots (bf_getbuffer/bf_releasebuffer) only entered the limited API in
# 3.11, and they are what make `a.Frame` zero-copy into memoryview/numpy.
# Below 3.11 this module must be built per-interpreter instead (see the
# packaging notes in ARCHITECTURE.md) — `b-py` stays on a lower abi3 floor
# either way, which is the split the capsule already supports.
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py311"] }
a = { path = "../a", default-features = false }
a-abi = { path = "../a-abi" }
a-ffi = { path = "../a-ffi", optional = true }
a-cshim = { path = "../a-cshim", optional = true }

[features]
# dynamic (default): the module links liba.so; the capsule vtable points at
# liba's linked symbols. static: the implementation is embedded in this
# module and the capsule vtable points at local wrappers — fully
# self-contained (wheel-friendly), liba.so not required.
default = ["dynamic"]
dynamic = ["a/dynamic", "dep:a-ffi"]
static = ["a/static", "dep:a-cshim"]

[build-dependencies]
pyo3-build-config = "0.26"

# Excluded packages cannot use `lints.workspace = true` (that requires
# workspace membership), so the root's lint table is repeated here verbatim.
# Same tax as the repeated version/edition fields — see "Workspace
# mechanics" in ARCHITECTURE.md. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pub_underscore_fields = "allow"

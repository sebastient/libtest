language = "C"
include_guard = "LIBA_H"
cpp_compat = true
documentation = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]
header = "/* liba — generated by cbindgen from a-capi; do not edit. */"
# The handle types are opaque BY CONTRACT: forward declarations only (their
# a-abi definitions are excluded below so no zero-length-array "complete"
# type ever leaks into the header). The A_* constants mirror a-abi and are
# asserted present by gen-header.sh.
after_includes = """
/* Wire status codes (a_try_fill, a_set_storage, a_test_panic): 0 = ok,
 * negative = error, append-only — treat unknown codes as A_STATUS_PANIC. */
#define A_STATUS_OK 0
#define A_STATUS_PANIC (-1)
#define A_STATUS_INVALID_ARGUMENT (-2)
#define A_STATUS_BUSY (-3)

#define A_ABI_VERSION 1
#define A_STORAGE_HEAP 0u
#define A_STORAGE_DMABUF 1u
#define A_STORAGE_IOSURFACE 2u

/* DRM format vocabulary carried by AFrameDescV2 (see a-abi). */
#define A_FOURCC_RGBA8888 875708754u
#define A_MODIFIER_LINEAR 0u

/* Subscription delivery policies (a_subscribe_with). */
#define A_DELIVERY_BLOCKING 0u
#define A_DELIVERY_LATEST 1u

typedef struct AHandle AHandle;
typedef struct ABuf ABuf;"""

[parse]
parse_deps = true
include = ["a-abi"]

[enum]
# Never inject bare `Ok`/`Panic` into the global namespace of every TU.
prefix_with_name = true

[export]
exclude = ["ABuf", "AHandle"]

[export.rename]
# The opaque handle's public C name; crate a's internal type name is `A`.
"A" = "AHandle"

# Standalone package (excluded from the root workspace — see the exclusion
# note there). The empty [workspace] table stops cargo's upward workspace
# search; workspace field inheritance is therefore unavailable here.
[workspace]

[package]
name = "b-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Sébastien Taylor <sebastien@au-zone.com>"]

[lib]
name = "b"
crate-type = ["cdylib"]

[dependencies]
b = { path = "../b", default-features = false }
a-abi = { path = "../a-abi" }
a = { path = "../a", default-features = false }

[features]
# See a-capi for why this exists and is empty.
capi = []
# Default: libb.so decoupled from liba.so via the C ABI (the whole point).
default = ["dynamic"]
dynamic = ["b/dynamic", "a/dynamic"]
# Contrast case: self-contained libb.so with A's implementation embedded —
# the naive duplication the architecture exists to avoid.
static = ["b/static", "a/static"]

[profile.release]
lto = true
strip = "debuginfo"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Excluded packages cannot use `lints.workspace = true` (that requires
# workspace membership), so the root's lint table is repeated here verbatim.
# Same tax as the repeated version/edition fields — see "Workspace
# mechanics" in ARCHITECTURE.md. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pub_underscore_fields = "allow"

# --- cargo-c: release packaging (see a-capi for the rationale) ---
[package.metadata.capi]
min_version = "0.9.0"

[package.metadata.capi.header]
generation = false
subdirectory = false
name = "libb"

[package.metadata.capi.library]
name = "b"
versioning = true

[package.metadata.capi.pkg_config]
name = "libb"
filename = "libb"
description = "Component B — C ABI, consumes A through liba's C ABI"
# The dependency that matters: libb is only usable where liba is installed,
# and pkg-config is where that is stated for consumers.
requires = "liba"

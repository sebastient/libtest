# Standalone package (excluded from the root workspace). Builds Python
# extension module `b`, which consumes a.A objects created by module `a`.
[workspace]

[package]
name = "b-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Sébastien Taylor <sebastien@au-zone.com>"]

[lib]
name = "b"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py39"] }
a = { path = "../a", default-features = false }
b = { path = "../b", default-features = false }
a-abi = { path = "../a-abi" }
# Its OWN quiet panic hook: hooks are per-cdylib (see a-rt), so module a
# installing one does nothing for panics raised in this module.
a-rt = { path = "../a-rt" }

[features]
# dynamic (default): this module links liba.so; the capsule is used only to
# unwrap a.A objects. vtable: no liba link at all — the capsule's function
# table is installed into crate a's vtable backend at first use.
default = ["dynamic"]
dynamic = ["a/dynamic", "b/dynamic"]
vtable = ["a/vtable", "b/vtable"]

[build-dependencies]
pyo3-build-config = "0.26"

# Excluded packages cannot use `lints.workspace = true` (that requires
# workspace membership), so the root's lint table is repeated here verbatim.
# Same tax as the repeated version/edition fields — see "Workspace
# mechanics" in ARCHITECTURE.md. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pub_underscore_fields = "allow"

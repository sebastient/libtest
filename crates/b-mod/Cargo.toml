# Standalone package (excluded). BoltFFI module "bmod" — B's surface as the
# SECOND independent module, consuming amod's objects via raw u64 handles.
# See a-mod/Cargo.toml for the multi-module rules.
[workspace]

[package]
name = "bmod"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Sébastien Taylor <sebastien@au-zone.com>"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boltffi = { path = "/Users/sebastien/Software/Mobile/boltffi/boltffi" }
a = { path = "../a", default-features = false, features = ["dynamic"] }
b = { path = "../b", default-features = false, features = ["dynamic"] }

# Excluded packages cannot use `lints.workspace = true` (that requires
# workspace membership), so the root's lint table is repeated here verbatim.
# Same tax as the repeated version/edition fields — see "Workspace
# mechanics" in ARCHITECTURE.md. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pub_underscore_fields = "allow"
